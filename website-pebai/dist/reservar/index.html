<head>

  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "yjwe6ir50h");
  </script>
  <style>
    @font-face {
      font-family: 'Manrope';
      src: url('../brand/Manrope-latin-variable.woff2') format('woff2');
      font-style: normal;
      font-weight: 200 800;
      font-display: swap;
    }
    :root {
      color-scheme: dark;
      --bg: #070911;
      --surface: #0E1222;
      --line: rgba(106, 92, 255, 0.18);
      --blue: #6A5CFF;
      --lime: #B7FF3C;
      --fg: #ECEBF0;
      --muted: #9498AC;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); }
    body { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; min-height: 100vh; overflow-x: hidden; }
    .bg-grid {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image: linear-gradient(rgba(106,92,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(106,92,255,.05) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at 50% 0%, #000 30%, transparent 75%);
    }
    .glow { position: fixed; top: -260px; left: 50%; width: 1000px; height: 560px; transform: translateX(-50%); background: radial-gradient(closest-side, rgba(106,92,255,.22), transparent); pointer-events: none; z-index: 0; }
    header { position: sticky; top: 0; z-index: 10; padding: 14px 24px; border-bottom: 1px solid var(--line); background: rgba(7,9,17,.86); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    .header-inner { max-width: 1120px; margin: 0 auto; display: flex; justify-content: center; }
    .brand-logo-img { height: 40px; width: auto; display: block; }
    main { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding: 40px 16px 64px; }
    .hero { text-align: center; max-width: 1080px; margin: 0 auto 30px; }
    h1 { font-size: clamp(28px, 4.4vw, 50px); line-height: 1.12; margin: 0 0 14px; font-weight: 800; color: #fff; letter-spacing: -0.01em; }
    h1 .nb { white-space: nowrap; display: inline-block; }
    h1 em { font-family: 'Instrument Serif', serif; font-weight: 400; color: var(--lime); }
    .sub { margin: 0 auto; max-width: 640px; color: var(--muted); font-size: 17px; line-height: 1.55; }
    .booker { position: relative; width: 100%; min-height: 560px; }
    #cal-inline { width: 100%; min-height: 560px; opacity: 0; transform: translateY(14px) scale(.985); transition: opacity .6s cubic-bezier(.2,.8,.2,1), transform .6s cubic-bezier(.2,.8,.2,1); }
    .booker.ready #cal-inline { opacity: 1; transform: none; }

    /* Esqueleto del calendario mientras carga Cal.com */
    .skeleton { position: absolute; inset: 0; display: flex; justify-content: center; transition: opacity .45s ease, transform .45s ease; pointer-events: none; }
    .booker.ready .skeleton { opacity: 0; transform: scale(.99); }
    .sk-card { width: 100%; max-width: 1010px; height: 520px; display: grid; grid-template-columns: 280px 1fr 240px; border: 1px solid #1D2442; border-radius: 14px; background: #0E1222; overflow: hidden; }
    .sk-col { padding: 26px 22px; display: flex; flex-direction: column; gap: 14px; }
    .sk-col + .sk-col { border-left: 1px solid #1D2442; }
    .sk { border-radius: 8px; background: linear-gradient(90deg, #151B36 0%, #1F2850 45%, #151B36 90%); background-size: 220% 100%; animation: shimmer 1.4s ease-in-out infinite; }
    .sk-avatar { width: 34px; height: 34px; border-radius: 50%; }
    .sk-line { height: 12px; }
    .sk-title { height: 22px; width: 82%; }
    .sk-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-top: 8px; }
    .sk-day { aspect-ratio: 1; border-radius: 10px; }
    .sk-day.on { background: linear-gradient(90deg, #2A3266 0%, #384290 45%, #2A3266 90%); background-size: 220% 100%; }
    .sk-slot { height: 38px; border-radius: 10px; }
    .sk-status { position: absolute; left: 50%; bottom: -34px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; white-space: nowrap; }
    .sk-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 12px var(--lime); animation: blink 1s ease-in-out infinite; }
    @keyframes shimmer { 0% { background-position: 120% 0; } 100% { background-position: -120% 0; } }
    @keyframes blink { 50% { opacity: .25; } }

    /* Transición de reserva confirmada */
    .booked { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 24px; pointer-events: none; opacity: 0; visibility: hidden; }
    .booked.on { pointer-events: all; visibility: visible; opacity: 1; }
    .booked-bg { position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, rgba(106,92,255,.28), rgba(7,9,17,.97) 55%); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); opacity: 0; }
    .booked.on .booked-bg { animation: fadeIn .45s ease forwards; }
    .badge { position: relative; width: 132px; height: 132px; margin-bottom: 30px; }
    .ripple { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(183,255,60,.55); opacity: 0; }
    .booked.on .ripple { animation: ripple 1.6s cubic-bezier(.2,.8,.2,1) .55s infinite; }
    .booked.on .ripple.r2 { animation-delay: 1.05s; }
    .ring { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 210deg, #6A5CFF, #B7FF3C, #6A5CFF); padding: 3px; transform: scale(.3) rotate(-90deg); opacity: 0; }
    .ring::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: #0B0F1D; }
    .booked.on .ring { animation: ringIn .7s cubic-bezier(.34,1.56,.64,1) .15s forwards; }
    .check { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
    .check path { fill: none; stroke: #B7FF3C; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 80; stroke-dashoffset: 80; filter: drop-shadow(0 0 10px rgba(183,255,60,.6)); }
    .booked.on .check path { animation: draw .55s cubic-bezier(.65,0,.35,1) .6s forwards; }
    .booked-title, .booked-date, .booked-progress { position: relative; opacity: 0; transform: translateY(16px); }
    .booked-title { font-size: clamp(26px, 4vw, 40px); font-weight: 800; color: #fff; margin: 0; }
    .booked-date { margin-top: 10px; font-family: 'Instrument Serif', serif; font-size: clamp(22px, 3vw, 30px); color: var(--lime); }
    .booked.on .booked-title { animation: up .55s cubic-bezier(.2,.8,.2,1) .85s forwards; }
    .booked.on .booked-date { animation: up .55s cubic-bezier(.2,.8,.2,1) 1s forwards; }
    .booked-progress { margin-top: 30px; width: 220px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
    .booked-progress span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #6A5CFF, #B7FF3C); }
    .booked.on .booked-progress { animation: up .5s ease 1.15s forwards; }
    .booked.on .booked-progress span { animation: fill 1.1s cubic-bezier(.65,0,.35,1) 1.25s forwards; }
    .booked-note { position: relative; margin-top: 12px; font-size: 13px; color: var(--muted); opacity: 0; }
    .booked.on .booked-note { animation: fadeIn .4s ease 1.3s forwards; }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes up { to { opacity: 1; transform: none; } }
    @keyframes ringIn { to { opacity: 1; transform: scale(1) rotate(0deg); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes ripple { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(1.9); } }
    @keyframes fill { to { width: 100%; } }
    body.leaving main, body.leaving header { transition: opacity .4s ease, filter .4s ease, transform .4s ease; opacity: .25; filter: blur(6px); transform: scale(.985); }
    @media (prefers-reduced-motion: reduce) {
      .sk, .sk-dot, .booked.on .ripple { animation: none; }
    }
    .help { text-align: center; margin-top: 22px; color: var(--muted); font-size: 14px; }
    .help a { color: var(--lime); font-weight: 700; text-decoration: none; }
    @media (max-width: 760px) {
      header { padding: 10px 16px; }
      .brand-logo-img { height: 32px; }
      main { padding: 26px 12px 48px; }
      .hero { margin-bottom: 20px; }
      .sub { font-size: 15px; }
      .sk-card { grid-template-columns: 1fr; height: 520px; }
      .sk-col.info .sk-line:nth-child(n+4), .sk-col.slots { display: none; }
      .sk-col + .sk-col { border-left: 0; border-top: 1px solid #1D2442; }
      }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="glow"></div>

  <header>
    <div class="header-inner">
      <a href="https://pebaisystems.es" aria-label="PEBAI Systems">
        <img class="brand-logo-img" src="../brand/pebai-horizontal-color-mineral-cropped.png" alt="PEBAI Systems" width="162" height="47">
      </a>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1><span class="nb">Tu empresa encaja.</span> <em class="nb">Elige cuándo hablamos.</em></h1>
      <p class="sub">Hemos analizado tu caso y vemos margen real de mejora. Reserva la sesión técnica con nuestro equipo de ingeniería.</p>
    </section>

    <section class="booker" aria-label="Calendario de reserva">
      <div class="skeleton" aria-hidden="true">
        <div class="sk-card">
          <div class="sk-col info">
            <div class="sk sk-avatar"></div>
            <div class="sk sk-line" style="width:45%"></div>
            <div class="sk sk-title"></div>
            <div class="sk sk-line" style="width:92%"></div>
            <div class="sk sk-line" style="width:78%"></div>
            <div class="sk sk-line" style="width:40%;margin-top:18px"></div>
            <div class="sk sk-line" style="width:52%"></div>
          </div>
          <div class="sk-col">
            <div class="sk sk-line" style="width:32%;height:16px"></div>
            <div class="sk-grid">
              <div class="sk sk-day"></div><div class="sk sk-day"></div><div class="sk sk-day"></div><div class="sk sk-day"></div><div class="sk sk-day"></div><div class="sk sk-day"></div><div class="sk sk-day"></div>
              <div class="sk sk-day on"></div><div class="sk sk-day on"></div><div class="sk sk-day on"></div><div class="sk sk-day on"></div><div class="sk sk-day on"></div><div class="sk sk-day"></div><div class="sk sk-day"></div>
              <div class="sk sk-day on"></div><div class="sk sk-day on"></div><div class="sk sk-day on"></div><div class="sk sk-day on"></div><div class="sk sk-day on"></div><div class="sk sk-day"></div><div class="sk sk-day"></div>
              <div class="sk sk-day"></div><div class="sk sk-day"></div><div class="sk sk-day"></div><div class="sk sk-day"></div><div class="sk sk-day"></div><div class="sk sk-day"></div><div class="sk sk-day"></div>
            </div>
          </div>
          <div class="sk-col slots">
            <div class="sk sk-line" style="width:40%;height:16px"></div>
            <div class="sk sk-slot"></div><div class="sk sk-slot"></div><div class="sk sk-slot"></div><div class="sk sk-slot"></div><div class="sk sk-slot"></div><div class="sk sk-slot"></div>
          </div>
        </div>
        <div class="sk-status"><span class="sk-dot"></span>Cargando huecos disponibles…</div>
      </div>
      <div id="cal-inline"></div>
    </section>


    <p class="help">¿No te encaja ningún hueco? <a href="https://wa.me/34624842799?text=Hola%20PEBAI%2C%20no%20me%20encaja%20ning%C3%BAn%20hueco%20para%20la%20sesi%C3%B3n." target="_blank" rel="noopener">Escríbenos por WhatsApp</a></p>
  </main>

  <div class="booked" id="booked" role="status" aria-live="polite">
    <div class="booked-bg"></div>
    <div class="badge">
      <span class="ripple"></span><span class="ripple r2"></span>
      <span class="ring"></span>
      <svg class="check" viewBox="0 0 132 132" aria-hidden="true"><path d="M42 68 L59 85 L92 50"/></svg>
    </div>
    <p class="booked-title">Sesión reservada</p>
    <div class="booked-date" id="booked-date"></div>
    <div class="booked-progress"><span></span></div>
    <div class="booked-note">Preparando tu confirmación…</div>
  </div>

  <script>
    (function () {
      'use strict';
      var params = new URLSearchParams(window.location.search);
      var solicitud = (params.get('s') || '').replace(/[^0-9]/g, '').slice(0, 10);

      // Loader oficial del embed de Cal.com
      (function (C, A, L) { var p = function (a, ar) { a.q.push(ar); }; var d = C.document; C.Cal = C.Cal || function () { var cal = C.Cal; var ar = arguments; if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement('script')).src = A; cal.loaded = true; } if (ar[0] === L) { var api = function () { p(api, arguments); }; var namespace = ar[1]; api.q = api.q || []; if (typeof namespace === 'string') { cal.ns[namespace] = cal.ns[namespace] || api; p(cal.ns[namespace], ar); p(cal, ['initNamespace', namespace]); } else p(cal, ar); return; } p(cal, ar); }; })(window, 'https://app.cal.com/embed/embed.js', 'init');

      Cal('init', 'sesion', { origin: 'https://cal.com' });

      var config = { layout: 'month_view', theme: 'dark' };
      if (solicitud) {
        config.solicitud = solicitud;               // campo oculto del evento
        config['metadata[solicitud]'] = solicitud;  // y en los metadatos de la reserva
      }

      Cal.ns.sesion('inline', {
        elementOrSelector: '#cal-inline',
        calLink: 'pebai-systems/sesion-tecnica',
        config: config
      });

      Cal.ns.sesion('ui', {
        theme: 'dark',
        hideEventTypeDetails: false,
        layout: 'month_view',
        cssVarsPerTheme: {
          dark: {
            'cal-brand': '#B7FF3C', 'cal-brand-emphasis': '#C9FF6B', 'cal-brand-text': '#0B0F14',
            'cal-bg': '#0E1222', 'cal-bg-muted': '#121831', 'cal-bg-subtle': '#1A2140', 'cal-bg-emphasis': '#262E52',
            'cal-border': '#262E52', 'cal-border-subtle': '#1D2442', 'cal-border-booker': '#1D2442',
            'cal-text': '#ECEBF0', 'cal-text-emphasis': '#FFFFFF', 'cal-text-subtle': '#9498AC', 'cal-text-muted': '#9498AC'
          }
        }
      });

      var booker = document.querySelector('.booker');
      function showCalendar() { booker.classList.add('ready'); }
      Cal.ns.sesion('on', { action: 'linkReady', callback: function () { setTimeout(showCalendar, 150); } });
      setTimeout(showCalendar, 9000);

      var redirected = false;
      function goToConfirmation(data) {
        if (redirected) return;
        data = data || {};
        var booking = data.booking || data;
        var start = data.startTime || booking.startTime || data.date || '';
        var end = data.endTime || booking.endTime || '';
        redirected = true;
        if (typeof clarity === 'function') { try { clarity('event', 'sesion_reservada'); } catch (e) {} }

        var d = new Date(start);
        if (start && !isNaN(d.getTime())) {
          var dias = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
          var meses = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
          var hora = d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
          document.getElementById('booked-date').textContent = dias[d.getDay()] + ' ' + d.getDate() + ' de ' + meses[d.getMonth()] + ' · ' + hora + ' h';
        }
        document.body.classList.add('leaving');
        document.getElementById('booked').classList.add('on');
        try { sessionStorage.setItem('pebai_booked_handoff', '1'); } catch (e) {}

        var url = '/confirmacion-de-llamada/';
        var q = [];
        if (start) q.push('startTime=' + encodeURIComponent(start));
        if (end) q.push('endTime=' + encodeURIComponent(end));
        var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        setTimeout(function () {
          window.location.href = url + (q.length ? '?' + q.join('&') : '');
        }, reduced ? 600 : 2450);
      }

      Cal.ns.sesion('on', { action: 'bookingSuccessfulV2', callback: function (e) { goToConfirmation(e.detail && e.detail.data); } });
      Cal.ns.sesion('on', { action: 'bookingSuccessful', callback: function (e) { goToConfirmation(e.detail && e.detail.data); } });
    })();
  </script>
  <script src="/utm.js" defer></script>
</body>
</html>
