
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1440px;
      background: #0A0D14;
      color: #F0F4F8;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 70px 75px;
      -webkit-font-smoothing: antialiased;
    }

    /* Fondo tecnologico con micro-cuadricula y resplandor sutil */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(circle at 80% 15%, rgba(0, 210, 255, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 20% 85%, rgba(79, 70, 229, 0.08) 0%, transparent 45%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
      pointer-events: none;
      z-index: 1;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 2;
    }
    .badge-tag {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 100px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #00D2FF;
    }
    .badge-tag::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00D2FF;
      box-shadow: 0 0 10px #00D2FF;
    }
    .page-indicator {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.08em;
    }

    /* Main Content */
    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 32px;
      margin: auto 0;
    }

    .main-headline {
      font-size: 54px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.03em;
      color: #FFFFFF;
    }
    .main-headline span {
      background: linear-gradient(135deg, #00D2FF 0%, #3B82F6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subline {
      font-size: 24px;
      line-height: 1.45;
      color: #94A3B8;
      font-weight: 500;
      max-width: 900px;
    }

    /* Cards and Glassmorphism Containers */
    .glass-card {
      background: rgba(18, 24, 38, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 36px 40px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
    }

    .bullet-item {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      font-size: 24px;
      line-height: 1.4;
      color: #CBD5E1;
      margin-bottom: 20px;
    }
    .bullet-item:last-child { margin-bottom: 0; }
    .bullet-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #00D2FF;
      margin-top: 12px;
      flex-shrink: 0;
      box-shadow: 0 0 12px rgba(0, 210, 255, 0.8);
    }

    /* Metric Card */
    .metric-box {
      display: flex;
      align-items: center;
      gap: 28px;
      margin-top: 24px;
      padding: 24px 32px;
      background: rgba(0, 210, 255, 0.05);
      border: 1px solid rgba(0, 210, 255, 0.2);
      border-radius: 20px;
    }
    .metric-value {
      font-size: 52px;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      color: #00D2FF;
    }
    .metric-text {
      font-size: 20px;
      color: #E2E8F0;
      font-weight: 600;
      line-height: 1.3;
    }

    /* Flow Steps */
    .flow-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 16px;
      margin-bottom: 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .flow-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .tag-before { background: rgba(239, 68, 68, 0.15); color: #F87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .tag-after { background: rgba(34, 197, 94, 0.15); color: #4ADE80; border: 1px solid rgba(34, 197, 94, 0.3); }

    /* CTA Slide */
    .cta-box {
      text-align: center;
      padding: 50px 40px;
    }
    .cta-button {
      display: inline-block;
      margin: 28px 0;
      padding: 22px 50px;
      background: linear-gradient(135deg, #00D2FF 0%, #3B82F6 100%);
      color: #0B0F17;
      font-size: 28px;
      font-weight: 800;
      border-radius: 100px;
      letter-spacing: -0.01em;
      box-shadow: 0 10px 30px rgba(0, 210, 255, 0.4);
    }

    /* Footer */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 30px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
      z-index: 2;
    }
    .brand-mark {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 0.05em;
      color: #FFFFFF;
    }
    .brand-mark span { color: #00D2FF; }
    .footer-note {
      font-size: 15px;
      color: #64748B;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="badge-tag">DIAGNÓSTICO ESTRATÉGICO</div>
    <div class="page-indicator">05 / 05</div>
  </div>

  <div class="content">
    <h1 class="main-headline">Audita tus procesos a coste cero</h1>
    
    

    

    

    

    
      <div class="glass-card cta-box">
        <div style="font-size: 20px; color: #94A3B8; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700;">ACCESO EXCLUSIVO</div>
        <div class="cta-button">Comenta CONSULTORIA</div>
        <p style="font-size: 19px; color: #CBD5E1; line-height: 1.4;">Sesión técnica privada de 45 minutos con nuestros ingenieros. Plazas limitadas a 5 empresas al mes.</p>
      </div>
    
  </div>

  <div class="footer">
    <div class="brand-mark">PEBAI <span>SYSTEMS</span></div>
    <div class="footer-note">Ingeniería de Procesos e IA</div>
  </div>
</body>
</html>
