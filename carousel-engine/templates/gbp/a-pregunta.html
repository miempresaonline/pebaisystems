<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>GBP A · Pregunta</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<link rel="stylesheet" href="_gbp.css">
<style>
  .title{font-size:100px;max-height:300px;margin-top:36px}
  .sub{margin-top:20px}
  .stage{margin-top:auto;padding-top:28px}

  /* tarjeta "llamadas": registro de llamadas perdidas */
  .calls{padding:20px 22px 22px}
  .calls .hd{display:flex;align-items:center;justify-content:space-between;padding:0 4px 14px}
  .calls .row{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:16px;height:52px;padding:0 4px;border-top:1px solid var(--line)}
  .calls .row b{font-size:18px;font-weight:600;letter-spacing:-.01em}
  .calls .row b small{display:block;font-size:13px;font-weight:500;color:var(--fg-45);margin-top:2px;letter-spacing:0}
  .calls .row time{font-family:var(--mono);font-size:15px;color:var(--fg-70)}
  .calls .fix{margin-top:14px;display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:16px;background:var(--chip-bg);color:var(--chip-fg);font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
  .calls .fix svg{flex:none;width:20px;height:20px}

  /* tarjeta "chat": asistente que recomienda empresas */
  .chat{padding:20px 24px 24px}
  .chat .hd{display:flex;align-items:center;gap:10px;padding-bottom:16px;border-bottom:1px solid var(--line)}
  .chat .dots{display:flex;gap:6px;margin-right:6px}
  .chat .dots i{width:10px;height:10px;border-radius:50%;background:var(--fg-12)}
  .chat .q{margin:18px 0 0 auto;max-width:78%;width:max-content;padding:13px 18px;border-radius:20px 20px 6px 20px;background:var(--s2);font-size:18px;font-weight:600;line-height:1.35}
  [data-theme="light"] .chat .q{background:#12121A;color:#F3F1EC}
  .chat .a{margin-top:16px;display:grid;grid-template-columns:38px 1fr;gap:14px}
  .chat .a p{font-size:17px;font-weight:500;color:var(--fg-70);padding-top:8px}
  .chat ol{list-style:none;grid-column:2;display:grid;gap:8px;margin-top:2px}
  .chat li{display:flex;align-items:center;gap:14px;height:44px;padding:0 14px;border-radius:12px;background:var(--fg-06)}
  .chat li .n{font-family:var(--mono);font-size:14px;color:var(--fg-45);width:18px}
  .chat li .bar{height:10px;border-radius:6px;background:var(--fg-12)}
  .chat li.me{background:transparent;outline:2px dashed var(--accent-line);outline-offset:-2px;color:var(--accent);font-size:18px;font-weight:700}
  .chat li.me .n{color:var(--accent)}
</style>
</head>
<body>
<div class="safe">
  <div class="top"><div class="logo" role="img" aria-label="PEBAI Systems"></div><span class="tag" id="tag"></span></div>
  <h1 class="title" id="title" data-fit="58"></h1>
  <p class="sub" id="sub"></p>
  <div class="stage" id="stage"></div>
  <div class="foot"><span class="url"><b>pebaisystems</b>.es</span><span class="note" id="note"></span></div>
</div>
<script src="_gbp.js"></script>
<script>
var ICON_MISSED = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/><path d="M16 2l6 6M22 2l-6 6"/></svg>';
var ICON_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';
var ICON_SPARK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>';

GBP.boot({
  theme: 'dark',
  tag: 'Atención al cliente',
  title: '¿Cuántas llamadas pierde tu empresa *fuera de horario*?',
  subtitle: 'Cada llamada sin contestar es un cliente que acaba llamando a otro.',
  card: 'calls',
  card_title: 'Llamadas perdidas · esta semana',
  items: ['Llamada perdida: Lun 20:47', 'Llamada perdida: Mié 21:15', 'Llamada perdida: Sáb 10:30'],
  highlight: 'Un agente de voz las atiende y te deja el resumen por WhatsApp.',
  question: '',
  answer: '',
  note: ''
}, function (d) {
  var $ = function (id) { return document.getElementById(id); };
  $('tag').textContent = d.tag || '';
  if (!d.tag) $('tag').style.display = 'none';
  $('title').innerHTML = GBP.md(d.title);
  $('sub').innerHTML = GBP.md(d.subtitle || '');
  $('note').innerHTML = GBP.md(d.note || '');
  var items = d.items || [];
  var html = '';
  if (d.card === 'calls') {
    html = '<div class="card calls"><div class="hd"><span class="kicker">' + GBP.esc(d.card_title) + '</span>' +
      '<span class="chip">' + items.length + ' sin contestar</span></div>';
    items.forEach(function (it) {
      var s = GBP.split(it);
      html += '<div class="row"><span class="ico">' + ICON_MISSED + '</span><b>' + GBP.esc(s.head) +
        (s.sub ? '<small>' + GBP.esc(s.sub) + '</small>' : '') + '</b><time>' + GBP.esc(s.text) + '</time></div>';
    });
    if (d.highlight) html += '<div class="fix">' + ICON_OK + '<span>' + GBP.md(d.highlight) + '</span></div>';
    html += '</div>';
  } else if (d.card === 'chat') {
    html = '<div class="card chat"><div class="hd"><span class="dots"><i></i><i></i><i></i></span><span class="kicker">' + GBP.esc(d.card_title || 'Asistente') + '</span></div>' +
      '<div class="q">' + GBP.md(d.question) + '</div>' +
      '<div class="a"><span class="ico">' + ICON_SPARK + '</span><p>' + GBP.md(d.answer) + '</p><ol>';
    var widths = [62, 48, 70, 55];
    items.forEach(function (it, i) {
      var label = typeof it === 'string' ? it : (it.title || '');
      if (label && label !== '-') {
        html += '<li class="me"><span class="n">' + (i + 1) + '.</span>' + GBP.md(label) + '</li>';
      } else {
        html += '<li><span class="n">' + (i + 1) + '.</span><span class="bar" style="width:' + widths[i % 4] + '%"></span></li>';
      }
    });
    html += '</ol></div></div>';
  }
  $('stage').innerHTML = html;
});
</script>
</body>
</html>
