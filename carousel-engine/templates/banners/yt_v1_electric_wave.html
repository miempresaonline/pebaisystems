<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>YouTube Banner - Electric Cobalt Wave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 2560px;
      height: 1440px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #0D65FF 0%, #0050FA 50%, #003ECC 100%);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .central-glow {
      position: absolute;
      width: 1500px;
      height: 750px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at center, rgba(100, 160, 255, 0.35) 0%, rgba(89, 74, 247, 0.25) 45%, transparent 75%);
      filter: blur(80px);
      pointer-events: none;
    }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 65%, rgba(0, 25, 90, 0.4) 100%);
      pointer-events: none;
    }

    .waves-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 2560px;
      height: 1440px;
      pointer-events: none;
    }

    .brand-center {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-logo-img {
      height: 185px;
      width: auto;
      filter: drop-shadow(0 16px 48px rgba(0, 20, 70, 0.5));
    }
  </style>
</head>
<body>

  <div class="central-glow"></div>
  <div class="vignette"></div>

  <!-- Concentric Wave Rings (Centered at 1280, 720) -->
  <svg class="waves-svg" viewBox="0 0 2560 1440" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="waveGlowYT" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="2.5"/>
      </filter>
    </defs>

    <!-- Ring 1 (Bold, centered around logo) -->
    <circle cx="1280" cy="720" r="380" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="14" filter="url(#waveGlowYT)" />
    <!-- Ring 2 -->
    <circle cx="1280" cy="720" r="540" fill="none" stroke="rgba(255, 255, 255, 0.28)" stroke-width="14" filter="url(#waveGlowYT)" />
    <!-- Ring 3 -->
    <circle cx="1280" cy="720" r="720" fill="none" stroke="rgba(255, 255, 255, 0.20)" stroke-width="14" filter="url(#waveGlowYT)" />
    <!-- Ring 4 -->
    <circle cx="1280" cy="720" r="930" fill="none" stroke="rgba(255, 255, 255, 0.14)" stroke-width="14" />
    <!-- Ring 5 -->
    <circle cx="1280" cy="720" r="1160" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="14" />
  </svg>

  <!-- Official PEBAI Horizontal Color Logo -->
  <div class="brand-center">
    <img src="../../assets/pebai/pebai-horizontal-color-mineral-2320.png" alt="PEBAI Systems" class="brand-logo-img">
  </div>

</body>
</html>
