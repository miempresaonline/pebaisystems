<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>YouTube Banner - Cinematic 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 2560px;
      height: 1440px;
      overflow: hidden;
      background-color: #07080B;
      font-family: 'Plus Jakarta Sans', sans-serif;
      position: relative;
      color: #FFFFFF;
    }

    /* Cinematic Stock Photo Background across full canvas */
    .bg-photo {
      position: absolute;
      top: 0;
      right: 0;
      width: 1600px;
      height: 1440px;
      object-fit: cover;
      object-position: center 30%;
      opacity: 0.45;
    }

    .gradient-mask {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #07080B 0%, #07080B 35%, rgba(7, 8, 11, 0.85) 60%, rgba(7, 8, 11, 0.4) 100%),
                  linear-gradient(180deg, rgba(7, 8, 11, 0.8) 0%, transparent 20%, transparent 80%, rgba(7, 8, 11, 0.9) 100%);
    }

    .ambient-glow {
      position: absolute;
      top: 400px;
      left: 300px;
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(183, 255, 60, 0.09) 0%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
    }

    /* FULL-WIDTH DESKTOP STRIPE: 2560 x 423 px */
    .banner-stripe {
      position: absolute;
      left: 0;
      top: 508px;
      width: 2560px;
      height: 423px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(90deg, 
        rgba(7, 8, 11, 0.9) 0%, 
        rgba(14, 16, 23, 0.95) 25%, 
        rgba(14, 16, 23, 0.8) 75%, 
        rgba(7, 8, 11, 0.6) 100%);
      box-shadow: 0 0 80px rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* SAFE ZONE: Centered 1546 x 423 px */
    .safe-zone {
      width: 1546px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 30px 0;
      position: relative;
    }

    /* Left Content Column */
    .left-col {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      max-width: 950px;
    }

    .badge-topic {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      padding: 7px 18px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #FFFFFF;
      width: fit-content;
    }

    .badge-topic::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #B7FF3C;
      box-shadow: 0 0 8px #B7FF3C;
    }

    .main-headline {
      font-size: 42px;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.035em;
      color: #FFFFFF;
    }

    .lime-text {
      color: #B7FF3C;
      text-shadow: 0 0 30px rgba(183, 255, 60, 0.35);
    }

    .sub-headline {
      font-size: 17px;
      font-weight: 500;
      color: #A1A1AA;
      line-height: 1.4;
    }

    .bottom-row {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .brand-logo {
      height: 32px;
      width: auto;
    }

    .web-pill {
      font-size: 14px;
      font-weight: 800;
      color: #B7FF3C;
      letter-spacing: 0.05em;
      background: rgba(183, 255, 60, 0.08);
      border: 1px solid rgba(183, 255, 60, 0.25);
      padding: 6px 16px;
      border-radius: 8px;
    }

    /* Right 3D Floating Tiles Column */
    .right-col {
      display: flex;
      align-items: center;
      gap: 20px;
      position: relative;
    }

    .tile-3d {
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(255, 255, 255, 0.25) inset;
    }

    .tile-whatsapp {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, #2EE06E 0%, #15A852 100%);
      transform: rotate(-6deg);
      border: 1.5px solid rgba(255, 255, 255, 0.3);
    }

    .tile-pebai {
      width: 120px;
      height: 120px;
      background: linear-gradient(135deg, #1C1D24 0%, #101116 100%);
      transform: rotate(4deg);
      border: 2px solid #B7FF3C;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(183, 255, 60, 0.35);
    }

    .tile-crm {
      width: 95px;
      height: 95px;
      background: linear-gradient(135deg, #594AF7 0%, #3B2BBF 100%);
      transform: rotate(-4deg);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>

  <!-- Full Background Photo & Masks -->
  <img src="../../assets/stock/stock_consultant_laptop.jpg" class="bg-photo" alt="Consultant Stock">
  <div class="gradient-mask"></div>
  <div class="ambient-glow"></div>

  <!-- Full-Width Stripe for Desktop, Tablet, and Mobile -->
  <div class="banner-stripe">
    <div class="safe-zone">
      <!-- Left Column -->
      <div class="left-col">
        <div class="badge-topic">OPTIMIZACIÓN OPERATIVA B2B</div>
        <h1 class="main-headline">MULTIPLICA TU CAPACIDAD OPERATIVA <span class="lime-text">SIN MULTIPLICAR TU PLANTILLA</span></h1>
        <p class="sub-headline">Agentes autónomos de IA que atienden por voz, WhatsApp y agendan en tu CRM las 24 horas.</p>
        <div class="bottom-row">
          <img src="../../assets/pebai/pebai-horizontal-light.svg" alt="PEBAI Systems" class="brand-logo">
          <div class="web-pill">pebaisystems.es</div>
        </div>
      </div>

      <!-- Right 3D Badges Column -->
      <div class="right-col">
        <div class="tile-3d tile-whatsapp">
          <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
          </svg>
        </div>

        <div class="tile-3d tile-pebai">
          <img src="../../assets/pebai/pebai-mark-color.svg" alt="PEBAI" style="width: 64px; height: 64px;">
        </div>

        <div class="tile-3d tile-crm">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
