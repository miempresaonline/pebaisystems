<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>YouTube Banner - Editorial Serif Luxe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 2560px;
      height: 1440px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #152250 0%, #0F172A 60%, #080C17 100%);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #F8FAFC;
    }

    .central-glow {
      position: absolute;
      width: 1500px;
      height: 750px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(ellipse at center, rgba(89, 74, 247, 0.45) 0%, rgba(37, 99, 235, 0.28) 45%, transparent 75%);
      filter: blur(80px);
      pointer-events: none;
    }

    .waves-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 2560px;
      height: 1440px;
      pointer-events: none;
    }

    .brand-center {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 32px;
    }

    .brand-mark {
      height: 145px;
      width: auto;
      filter: drop-shadow(0 14px 36px rgba(0, 0, 0, 0.5));
    }

    .brand-text-lockup {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .brand-title {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 155px;
      font-weight: 400;
      line-height: 0.88;
      color: #FFFFFF;
      letter-spacing: -0.01em;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.4));
    }

    .brand-subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.44em;
      color: rgba(248, 250, 252, 0.75);
      margin-top: 10px;
      margin-left: 6px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="central-glow"></div>

  <!-- Concentric Sonic Rings (Centered at 1280, 720) -->
  <svg class="waves-svg" viewBox="0 0 2560 1440" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="glowSerifYT" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="2.5"/>
      </filter>
    </defs>
    <!-- Ring 1 -->
    <circle cx="1280" cy="720" r="380" fill="none" stroke="rgba(255, 255, 255, 0.32)" stroke-width="12" filter="url(#glowSerifYT)" />
    <!-- Ring 2 -->
    <circle cx="1280" cy="720" r="540" fill="none" stroke="rgba(89, 74, 247, 0.38)" stroke-width="12" filter="url(#glowSerifYT)" />
    <!-- Ring 3 -->
    <circle cx="1280" cy="720" r="720" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="12" filter="url(#glowSerifYT)" />
    <!-- Ring 4 -->
    <circle cx="1280" cy="720" r="930" fill="none" stroke="rgba(89, 74, 247, 0.22)" stroke-width="12" />
    <!-- Ring 5 -->
    <circle cx="1280" cy="720" r="1160" fill="none" stroke="rgba(255, 255, 255, 0.10)" stroke-width="12" />
  </svg>

  <!-- Official Ribbon Mark + Beloved Instrument Serif Typography -->
  <div class="brand-center">
    <img src="../../assets/pebai/pebai-mark-color-512.png" alt="PEBAI Mark" class="brand-mark">
    <div class="brand-text-lockup">
      <div class="brand-title">pebai</div>
      <div class="brand-subtitle">SYSTEMS</div>
    </div>
  </div>

</body>
</html>
