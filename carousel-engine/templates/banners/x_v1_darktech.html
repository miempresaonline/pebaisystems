<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>X Banner - Dark Tech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1500px;
      height: 500px;
      overflow: hidden;
      background-color: #07080B;
      font-family: 'Plus Jakarta Sans', sans-serif;
      position: relative;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 44px 70px;
    }

    /* Background Ambient Tech Glows */
    .ambient-glow-1 {
      position: absolute;
      top: -100px;
      left: 100px;
      width: 600px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(183, 255, 60, 0.1) 0%, rgba(183, 255, 60, 0) 70%);
      filter: blur(60px);
      pointer-events: none;
    }

    .ambient-glow-2 {
      position: absolute;
      top: 50px;
      right: -50px;
      width: 700px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.14) 0%, rgba(99, 102, 241, 0) 70%);
      filter: blur(60px);
      pointer-events: none;
    }

    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(circle at 60% 50%, black 50%, transparent 95%);
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 10;
    }

    .brand-logo {
      height: 34px;
      width: auto;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(183, 255, 60, 0.08);
      border: 1px solid rgba(183, 255, 60, 0.25);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #B7FF3C;
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #B7FF3C;
      box-shadow: 0 0 8px #B7FF3C;
    }

    /* Main Center Content (Clear of bottom-left avatar zone) */
    .hero-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
    }

    .main-headline {
      font-size: 42px;
      font-weight: 900;
      line-height: 1.12;
      letter-spacing: -0.035em;
      color: #FFFFFF;
      max-width: 1100px;
    }

    .lime-text {
      color: #B7FF3C;
      text-shadow: 0 0 30px rgba(183, 255, 60, 0.35);
    }

    .sub-headline {
      font-size: 17px;
      font-weight: 500;
      color: #A1A1AA;
      line-height: 1.4;
      max-width: 900px;
    }

    /* Bottom Bar: Pushed to the right so bottom-left avatar doesn't cover anything */
    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      position: relative;
      z-index: 10;
      gap: 20px;
      padding-left: 360px; /* Safe space for profile avatar */
    }

    .chips-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .feature-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      color: #E4E4E7;
    }

    .feature-chip svg {
      stroke: #B7FF3C;
    }

    .url-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #07080B;
      background: #B7FF3C;
      padding: 8px 18px;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(183, 255, 60, 0.3);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- Ambient Glow & Technical Grid -->
  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>
  <div class="bg-grid"></div>

  <!-- Top Bar -->
  <div class="top-bar">
    <img src="../../assets/pebai/pebai-horizontal-light.svg" alt="PEBAI Systems" class="brand-logo">
    <div class="status-badge">
      <span class="status-dot"></span>
      SISTEMA AUTÓNOMO OPERATIVO
    </div>
  </div>

  <!-- Hero Content -->
  <div class="hero-content">
    <h1 class="main-headline">INFRAESTRUCTURA DE AGENTES DE IA <span class="lime-text">PARA EMPRESAS</span></h1>
    <p class="sub-headline">Automatizamos llamadas, WhatsApp 24/7 y la sincronización con tu CRM sin intervención humana.</p>
  </div>

  <!-- Bottom Features (Safe from avatar) -->
  <div class="bottom-bar">
    <div class="chips-group">
      <div class="feature-chip">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.5"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
        Voz 24/7
      </div>
      <div class="feature-chip">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.5"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
        WhatsApp API
      </div>
      <div class="feature-chip">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        CRM Sync
      </div>
    </div>
    <div class="url-pill">pebaisystems.es &rarr;</div>
  </div>

</body>
</html>
